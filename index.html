<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>BO1 Zombies Drop Tracker</title>
<style>
/* Layout: in-game HUD look. Dark flat column, icon-only drop grid, red numerals, maroon keys. One committed dark theme. */
:root{
--bg:#07080a;--glow:#2a0b10;--text:#ffffff;--muted:#b4b0ab;--line:#3a2e30;
--red:#ff2d3f;--red-d:#3d0a12;--red-line:#a31c2c;--ink:#07080a;--rgb:255,45,63;--time:#ffd24a;
--mono:"Cascadia Mono","SF Mono",Consolas,"Liberation Mono","Courier New",monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;font-size:clamp(16px,.4vw + 14.4px,20px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:radial-gradient(120% 60% at 15% 0%,var(--glow) 0,transparent 60%);color:var(--text);
font:.8125rem/1.4 var(--mono);font-variant-numeric:tabular-nums;
padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:min(100%,440px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
header,.foot{grid-column:1/-1}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
h1{font:700 .72rem/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;margin:0;color:var(--muted)}
.cap{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0}
.cap.red{color:var(--red)}
section{padding:9px 0;border-top:1px solid var(--line)}
.s-drops{border-top:0;padding-top:0}

button{font:inherit;color:var(--text);background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.sw input:focus-visible+i,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:active{transform:scale(.97)}

/* drops */
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:14px 6px}
.locsg{grid-template-columns:repeat(4,minmax(0,1fr))}
.drop{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0;min-width:0;color:var(--text)}
.drop .ico{width:38px;height:38px;display:block;transition:color .12s}
.pic{display:block;width:clamp(54px,5vw,72px);height:clamp(40px,3.7vw,54px);background-color:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;transition:background-color .12s}
.drop .nm{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;overflow-wrap:normal;line-height:1.25}
.drop.on .ico,.drop.on .pic,.drop.on .nm{color:var(--red)}
#cyc{margin-top:0}
#opts{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px}
.sw{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:28px;height:16px;border-radius:999px;background:#3a3a3c;position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#d8d6d3;transition:transform .15s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i::after{transform:translateX(12px)}

/* special rounds */
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.num{font:700 1.9rem/1 var(--mono);color:var(--red);min-width:3ch}
#spn{width:3ch;background:transparent;border:0;border-bottom:1px solid var(--red-line);border-radius:0;color:var(--red);text-align:center;font:700 1.25rem/1 var(--mono);padding:0;-moz-appearance:textfield}
#spn::-webkit-inner-spin-button,#spn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#spn::placeholder{color:var(--red-line)}
.boxes{display:flex;gap:6px;min-width:0}
.box{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:36px;padding:2px 5px;background:var(--red-d);border:1px solid var(--red-line);border-radius:8px;color:#f3dede;font-weight:700;font-size:.74rem;line-height:1.1}
.box small{font-size:.58rem;font-weight:600;letter-spacing:.1em;color:#f3dede}
.cnt{position:absolute;top:-11px;right:-11px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--red);color:#fff;font:800 .78rem/21px var(--mono);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.boxes .cnt{position:static;display:block;min-width:0;height:auto;padding:0;margin-top:2px;border-radius:0;background:none;box-shadow:none;color:var(--red);font:800 .78rem/1 var(--mono);text-shadow:0 0 8px rgba(var(--rgb),.6)}
.boxes .cnt::before{content:"\00d7";margin-right:1px}
.boxes .box{padding:4px 10px 5px}
.box:hover{border-color:var(--red)}
.hint{color:var(--muted);font-size:.62rem;margin:0;line-height:1.3}
.tools{display:flex;align-items:center;gap:8px;margin-top:12px}
.tabs{display:flex;gap:2px;flex:none}
.tab{padding:4px 8px;border-radius:7px;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid transparent}
.tab.on{color:#f3dede;background:var(--red-d);border-color:var(--red-line)}
input{font:inherit;color:var(--text);background:#1d1d1f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input::placeholder{color:#6e6c69}
#rnd{flex:1;width:0}
.key{padding:8px 12px;border-radius:8px;background:var(--red-d);border:1px solid var(--red-line);color:var(--red);font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;flex:none}
.key:hover{border-color:var(--red)}
.info{color:var(--muted);font-size:.68rem;margin:8px 0 0}
ul{list-style:none;margin:0;padding:0;max-height:130px;overflow-y:auto}
#splog{margin-top:4px}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.74rem}
li:last-child{border-bottom:0}
li small{color:var(--muted)}
li .l{display:flex;align-items:center;gap:8px}
li .k{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:5ch}
.x{padding:0 6px;color:var(--muted);font-size:1rem;line-height:1.2}
.x:hover{color:var(--red)}
.empty{color:var(--muted);padding:6px 0;font-size:.72rem}

/* hordes */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.sq{width:26px;height:26px;border-radius:8px;background:var(--red-d);border:1px solid var(--red-line);color:var(--red);font-size:1.1rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.sq:hover{border-color:var(--red)}
#zr{width:3ch;min-width:0;background:transparent;border:0;border-radius:0;border-bottom:1px solid var(--line);text-align:center;font:700 1rem/1.2 var(--mono);padding:1px 0;-moz-appearance:textfield}
#zr::-webkit-inner-spin-button,#zr::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hv .num{font-size:1.5rem;min-width:0}
.players{margin-top:8px;display:flex;gap:2px;justify-content:flex-end}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ghost{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-radius:6px}
.ghost:hover{color:var(--text)}
.ghost.warn{color:var(--red)}
.grow{flex:1;min-width:0;width:0}
.pin{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:color .12s}
.pin::before{content:"";width:20px;height:20px;border:2px solid currentColor;border-radius:50%;transition:background-color .12s}
.drop.on .pin{color:var(--red)}
.drop.prev .pin{outline:1px dashed var(--red-line);outline-offset:2px;border-radius:6px}
.drop.prev .nm{color:var(--red)}
.drop.prev .nm::after{content:" \2022 prev";opacity:.7}
.drop.on .pin::before{background-color:currentColor;width:28px;height:28px}
.pin.bolt::before{display:none}
.pin.bolt svg{width:28px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transition:fill .12s}
.drop.on .pin.bolt svg{fill:currentColor}
.pin.img::before{display:none}
.pin.img img{width:38px;height:36px;object-fit:contain;display:block;filter:grayscale(1) brightness(.85);opacity:.6;transition:filter .12s,opacity .12s}
.drop.on .pin.img img{filter:none;opacity:1}
.pin.img b{top:-2px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:.62rem;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.pin.bolt b{top:0;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:.62rem;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.pin b{position:absolute;font:700 .85rem/1 var(--mono);color:var(--ink)}
.foot #reset{margin-left:auto}
.foot{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:3px 0}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding-right:10px}
.col+.col{padding-left:10px;padding-right:0;border-left:1px solid var(--line);align-items:flex-start}
.hh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.step .num{font-size:1.1rem;line-height:1;min-width:0;margin-left:4px}
/* Responsive: phone column, two columns, three columns; short windows tighten up. */
@media (min-width:640px){
  main{max-width:min(100%,1240px);grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:start}
  main>.sec{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;background:rgba(255,255,255,.025)}
  .s-drops{grid-column:1;grid-row:2}
  .s-box{grid-column:2;grid-row:2}
  .s-pair{grid-column:1/-1;grid-row:3}
  .foot{grid-row:4}
}
@media (min-width:1100px){
  main{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
  .s-drops .drops{grid-template-columns:repeat(auto-fit,minmax(66px,1fr))}
  .locsg{grid-template-columns:repeat(8,minmax(0,1fr))}
  .drop .nm{letter-spacing:.06em}
}
@media (min-width:640px){
  main>.sec.s-pair{padding:8px 14px}
  .pair .col{flex-direction:row;align-items:center;gap:12px}
  .pair .cap{white-space:nowrap}
}
@media (max-height:540px){
  body{padding-block:8px 12px}
  header{margin-bottom:8px}
  section{padding-block:6px}
  main>.sec{padding:10px}
  .drops{gap:6px}
  .drop{padding:2px 0;gap:3px}
  .pic{height:30px;width:46px}
  .pin{height:30px}
  #opts{margin-top:2px}
}
.winctl{display:flex;gap:4px}
.winctl button{width:26px;height:22px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:.95rem;line-height:1}
.winctl button:hover{color:var(--text);border-color:var(--muted)}
.winctl button:last-child:hover{color:var(--red);border-color:var(--red)}
html.clear{--muted:#bdbab6;--line:#4a4a4d}
html.clear body{background:none;background-color:transparent}
html.clear body{text-shadow:0 1px 3px rgba(0,0,0,.85)}
html.clear header{-webkit-app-region:drag;app-region:drag;padding-top:2px;padding-bottom:2px}
html.clear header button{-webkit-app-region:no-drag;app-region:no-drag}
html.clear .winctl{display:flex}
.hv2{display:flex;flex-direction:column;margin-left:4px;line-height:1.05;min-width:0}
.hv2 .num{margin-left:0}
.killed{display:flex;align-items:center;gap:8px;margin-top:6px}
.killed .cap{margin:0}
.clays{margin-left:auto;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.clays b{color:var(--text);font-size:.8rem;margin-left:3px}
#hkv{width:6ch;background:transparent;border:0;border-bottom:1px solid var(--red-line);border-radius:0;color:var(--red);text-align:center;font:700 1.05rem/1 var(--mono);padding:0;-moz-appearance:textfield}
#hkv::-webkit-inner-spin-button,#hkv::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#hkv::placeholder{color:var(--red-line)}
#zt{font-size:.62rem;color:var(--muted);letter-spacing:.04em}
#zt:empty{display:none}
.gear{display:flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.gear:hover{color:var(--text);border-color:var(--muted)}
.gear svg{width:14px;height:14px}
header{align-items:center;gap:8px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{width:100%;max-width:420px;max-height:100%;overflow:auto;background:#1a1a1c;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-shadow:none}
.mhead{display:flex;justify-content:space-between;align-items:center}
.hkrow{display:flex;align-items:center;gap:8px}
.hkrow>span{width:5.6rem;flex:none;font-size:.78rem}
.hkfield{flex:1;min-width:0;padding:8px 10px;border-radius:8px;background:#232326;border:1px solid var(--line);color:var(--text);font-size:.78rem;text-align:left}
.hkfield.rec{border-color:var(--red);color:var(--red)}
.hkst{margin:0 0 4px;font-size:.66rem;color:var(--muted);min-height:.9rem;padding-left:calc(5.6rem + 8px)}
.hkst.bad{color:var(--red)}
main.hide-drops .s-drops,main.hide-box .s-box,main.hide-monkey .col-monkey,main.hide-hordes .col-hordes{display:none}
main.hide-monkey.hide-hordes .s-pair{display:none}
main.hide-monkey .pair,main.hide-hordes .pair{grid-template-columns:minmax(0,1fr)}
main.hide-monkey .col-hordes,main.hide-hordes .col-monkey{border-left:0;padding-left:0;padding-right:0}
main.hide-drops .s-box,main.hide-box .s-drops{grid-column:1/-1}
main.hide-drops #cyc{display:none}
#secs{display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Stream theme: near-black base, saturated red, brighter text, bold numerals and soft glow for legibility under video compression */
body{text-shadow:0 1px 2px rgba(0,0,0,.9)}
h1{color:#fff;font-size:.8rem;letter-spacing:.26em;text-shadow:0 0 12px rgba(var(--rgb),.55)}
.cap{color:#d2cec9;font-weight:700}
.cap.red{color:var(--red)}
main>.sec{background:linear-gradient(180deg,rgba(var(--rgb),.07),rgba(0,0,0,.35));border:1px solid var(--red-line);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 18px rgba(var(--rgb),.12) inset}
.drop .nm{color:#d2cec9;font-weight:700}
.drop.on .pin,.drop.on .nm{text-shadow:0 0 10px rgba(var(--rgb),.8)}
.drop.on .pin{filter:drop-shadow(0 0 6px rgba(var(--rgb),.7))}
.num,#spn,#hkv,#zr{font-weight:800;text-shadow:0 0 10px rgba(var(--rgb),.55)}
#zr{color:#fff}
#zt{color:var(--time);font-weight:700}
.sq,.box{border-color:var(--red);box-shadow:0 0 10px rgba(var(--rgb),.3)}
.cnt,.pin.img b,.pin.bolt b{background:var(--red);color:#fff;box-shadow:0 0 8px rgba(var(--rgb),.7)}
input{background:#101114;border-color:#4a3a3d}
.ghost{color:#d2cec9}
.hbtns{display:flex;gap:6px;align-items:center}
.lgrow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:.72rem}
.lgrow time{color:var(--muted);font-size:.62rem;min-width:56px}
.lgh{margin:12px 0 2px;color:var(--red)}
.lgrow b{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);min-width:50px}
.lgrow.off span{color:var(--muted);text-decoration:line-through}
#lglist{overflow:auto;max-height:60vh}
.detgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0}
.detgrid label{display:flex;flex-direction:column;gap:3px;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.detgrid input{padding:5px 6px;font-size:.8rem}
#detimg{max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:4px;background:#000}
.cnt,.pin.img b,.pin.bolt b{color:var(--on,#fff)}
html[data-xmas] body{background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,255,255,.55),transparent),radial-gradient(1.5px 1.5px at 90px 80px,rgba(255,255,255,.4),transparent),radial-gradient(2px 2px at 150px 20px,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 60px 140px,rgba(255,255,255,.35),transparent),radial-gradient(120% 60% at 15% 0%,var(--glow) 0,transparent 60%);background-size:180px 180px,180px 180px,180px 180px,180px 180px,100% 100%}
html[data-xmas] main>.sec{border-color:#2fbf62;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 18px rgba(47,191,98,.14) inset}
html[data-xmas] h1{text-shadow:0 0 12px color-mix(in srgb,var(--red) 60%,transparent)}
html[data-xmas] .sq,html[data-xmas] .box{border-color:var(--red);box-shadow:0 0 10px color-mix(in srgb,var(--red) 35%,transparent)}
html[data-xmas] .drop.on .pin,html[data-xmas] .drop.on .nm,html[data-xmas] .num,html[data-xmas] #spn,html[data-xmas] #hkv{text-shadow:0 0 10px color-mix(in srgb,var(--red) 75%,transparent)}
.colrow{display:flex;align-items:center;gap:10px;padding:4px 0 2px}
#colpick{width:56px;height:34px;padding:2px;border-radius:8px;background:#101114;border:1px solid var(--line);cursor:pointer}
#colhex{font-size:.74rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main>
<header>
  <h1>Zombies Drop Tracker</h1>
  <p class="cap" id="cyc" style="margin:0">Cycle 1</p>
  <div class="hbtns"><button id="logbtn" class="gear" aria-label="Activity log" title="Activity log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.500" cy="6" r="1"/><circle cx="3.500" cy="12" r="1"/><circle cx="3.500" cy="18" r="1"/></svg></button><button id="gear" class="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <div class="winctl" id="winctl" hidden><button id="wmin" aria-label="Minimize">&minus;</button><button id="wclose" aria-label="Close">&times;</button></div>
</header>

<section class="sec s-drops">
  <div class="drops" id="drops"></div>
  <div id="opts"></div>
</section>

<section class="pair sec s-pair">
  <div class="col col-monkey">
    <p class="cap red" id="splbl">Monkey round</p>
    <div class="srow">
      <input id="spn" type="number" inputmode="numeric" min="1" max="255" placeholder="–" aria-label="Special round number">
      <div class="boxes" id="gapsel"></div>
    </div>
  </div>
  <div class="col col-hordes">
    <p class="cap">Hordes</p>
    <div class="step">
      <button id="zdec" class="sq" aria-label="Previous round">&minus;</button>
      <input id="zr" type="number" inputmode="numeric" min="1" max="200" value="1" aria-label="Round number">
      <button id="zinc" class="sq" aria-label="Next round">+</button>
      <span class="hv2"><span class="num" id="zn">0.25</span><small id="zt"></small></span>
    </div>
    <div class="killed"><span class="cap">Killed</span><input id="hkv" type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-label="Hordes killed this round"><span class="clays" id="zcl" hidden></span></div>
  </div>
</section>

<section class="sec s-box">
  <div class="bar">
    <p class="cap">Mystery box</p>
    <div style="display:flex;align-items:center;gap:6px"><span class="cap" id="boxinfo"></span><button id="locclr" class="ghost">Clear</button></div>
  </div>
  <div class="drops locsg" id="locs"></div>
</section>

<footer class="foot"><label class="sw" id="toprow" hidden><span>Always on top</span><input id="topcb" type="checkbox" role="switch" aria-label="Always on top"><i></i></label><label class="sw" id="trrow" hidden><span>Transparent</span><input id="trcb" type="checkbox" role="switch" aria-label="Transparent background"><i></i></label><button id="reset" class="ghost">Reset</button></footer>
</main>

<div class="modal" id="logm" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="ltitle">
    <div class="mhead"><p class="cap" id="ltitle">Activity log</p><button id="lclose" class="ghost">Close</button></div>
    <p class="hint" id="lgn"></p>
    <div id="lglist"></div>
  </div>
</div>
<div class="modal" id="settings" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <div class="mhead"><p class="cap" id="stitle">Settings</p><button id="sclose" class="ghost">Close</button></div>
    <p class="cap" style="margin-top:6px">Round hotkeys</p>
    <div class="hkrow"><span>Round up</span><button id="hk-up" class="hkfield"></button><button id="hkc-up" class="ghost">Clear</button></div>
    <p class="hkst" id="hkst-up"></p>
    <div class="hkrow"><span>Round down</span><button id="hk-down" class="hkfield"></button><button id="hkc-down" class="ghost">Clear</button></div>
    <p class="hkst" id="hkst-down"></p>
    <p class="info" id="hknote" style="margin-top:2px"></p>
    <p class="cap" style="margin-top:10px">Sections</p>
    <div id="secs"></div>
    <div id="detbox" hidden>
      <p class="cap" style="margin-top:10px">Auto-detect round</p>
      <label class="sw"><input type="checkbox" id="deton" role="switch"><i></i><span>Read round from screen</span></label>
      <div class="detgrid">
        <label>Left %<input id="det-x" type="number" min="0" max="99" step="1"></label>
        <label>Top %<input id="det-y" type="number" min="0" max="99" step="1"></label>
        <label>Width %<input id="det-w" type="number" min="2" max="100" step="1"></label>
        <label>Height %<input id="det-h" type="number" min="2" max="100" step="1"></label>
      </div>
      <img id="detimg" alt="" hidden>
      <p class="info" id="detst" style="margin-top:4px">Off. Point the area at the round counter in the bottom-left of your game (borderless or windowed).</p>
    </div>
    <p class="cap" style="margin-top:10px">Color</p>
    <div class="colrow"><input type="color" id="colpick" value="#ff2d3f" aria-label="Accent color"><span id="colhex">#ff2d3f</span><button id="colrst" class="ghost" style="margin-left:auto">Default</button></div>
    <label class="sw"><input type="checkbox" id="xmasck" role="switch"><i></i><span>Christmas theme (green panels, snow)</span></label>
  </div>
</div>

      if(locked)return;
      if(S.active[t]){
        delete S.active[t];logEv("Drop",t,true);
        for(var i=S.drops.length-1;i>=0;i--){if(S.drops[i].t===t){S.drops.splice(i,1);break;}}
      }else{S.active[t]=true;logEv("Drop",t);S.drops.push({t:t,ts:Date.now()});}
      save();render();
      maybeReset();
    };
    g.appendChild(b);
  });
}

$("hkv").onchange=function(){var v=parseFloat(this.value);if(this.value.trim()==="")delete S.kr[S.zr];else if(isFinite(v)&&v>=0)S.kr[S.zr]=Math.round(v*100)/100;save();showK();};
$("hkv").onkeydown=function(e){if(e.key==="Enter")this.blur();};
$("zdec").onclick=function(){if(S.zr>1){S.zr--;save();renderZ();}};
$("zinc").onclick=function(){if(S.zr<200){S.zr++;save();renderZ();}};
$("zr").oninput=function(){var v=parseInt(this.value,10);if(v>=1&&v<=200){S.zr=v;save();showZ();}};
$("zr").onblur=function(){renderZ();};
$("spn").onchange=function(){var v=parseInt(this.value,10);if(v>=1&&v<=255){addSpecial(S.sk,v);logEv("Monkey",mlabel(v));save();}render();};
$("spn").onkeydown=function(e){if(e.key==="Enter")this.blur();};
function clearBox(){var last="",t=-1;Object.keys(S.bs).forEach(function(n){var v=Number(S.bs[n]);if(v>t){t=v;last=n;}});S.bp=last;S.bs={};save();renderBox();}
$("locclr").onclick=clearBox;
var armed=null;
$("reset").onclick=function(){
  var b=$("reset");
  if(!armed){
    if(!S.drops.length&&!S.specials.length&&!S.cycles)return;
    b.textContent="Tap to confirm";b.className="ghost warn";
    armed=setTimeout(function(){armed=null;b.textContent="Reset";b.className="ghost";},3000);
    return;
  }
  clearTimeout(armed);armed=null;b.textContent="Reset";b.className="ghost";
  S.drops=[];S.active={};S.cycles=0;S.specials=[];S.bc="";S.bs={};S.bp="";S.kr={};S.log=[];S.m4=0;S.m5=0;save();render();
};
if(window.desktop&&typeof window.desktop.setAlwaysOnTop==="function"){
  var applyTr=function(on){
    document.documentElement.classList.toggle("clear",!!on);
    $("winctl").hidden=!on;
  };
  $("toprow").hidden=false;$("trrow").hidden=false;
  if(window.desktop.getPrefs){
    window.desktop.getPrefs().then(function(pr){
      $("topcb").checked=!!(pr&&pr.onTop);
      $("trcb").checked=!!(pr&&pr.transparent);
      applyTr(!!(pr&&pr.transparent));
    }).catch(function(){});
  }
  $("topcb").onchange=function(){window.desktop.setAlwaysOnTop(this.checked);};
  $("trcb").onchange=function(){applyTr(this.checked);if(window.desktop.setTransparent)window.desktop.setTransparent(this.checked);};
  $("wmin").onclick=function(){if(window.desktop.minimize)window.desktop.minimize();};
  $("wclose").onclick=function(){if(window.desktop.close)window.desktop.close();};
}

function stepRound(d){var v=S.zr+d;if(v<1||v>200)return;S.zr=v;save();renderZ();}
var DESK=!!(window.desktop&&typeof window.desktop.setHotkeys==="function");
if(!S.hk||typeof S.hk!=="object")S.hk={up:"",down:""};
function accelFromEvent(e){
  var k=e.key,c=e.code,key=null;
  if(["Control","Shift","Alt","Meta","AltGraph"].indexOf(k)>=0)return null;
  if(/^Key[A-Z]$/.test(c))key=c.slice(3);
  else if(/^Digit[0-9]$/.test(c))key=c.slice(5);
  else if(/^F([1-9]|1[0-9]|2[0-4])$/.test(c))key=c;
  else if(/^Numpad[0-9]$/.test(c))key="num"+c.slice(6);
  else{
    var map={ArrowUp:"Up",ArrowDown:"Down",ArrowLeft:"Left",ArrowRight:"Right",PageUp:"PageUp",PageDown:"PageDown",Home:"Home",End:"End",Insert:"Insert",Delete:"Delete",Space:"Space",NumpadAdd:"numadd",NumpadSubtract:"numsub",NumpadMultiply:"nummult",NumpadDivide:"numdiv",NumpadDecimal:"numdec",Minus:"-",Equal:"=",BracketLeft:"[",BracketRight:"]",Comma:",",Period:".",Slash:"/",Semicolon:";"};
    key=map[c]||null;
  }
  if(!key)return null;
  var mods=[];if(e.ctrlKey)mods.push("Ctrl");if(e.altKey)mods.push("Alt");if(e.shiftKey)mods.push("Shift");if(e.metaKey)mods.push("Super");
  if(!mods.length&&!(/^F\d+$/.test(key)||/^num/.test(key)))return "!";
  return mods.concat(key).join("+");
}
function prettyAccel(a){return a?a.replace(/Super/g,"Win").replace(/\+/g," + "):"Not set";}
var capturing=null;
function hkStatus(dir,txt,bad){var el=$("hkst-"+dir);el.textContent=txt||"";el.className="hkst"+(bad?" bad":"");}
function applyHotkeys(){
  $("hk-up").textContent=capturing==="up"?"Press keys\u2026":prettyAccel(S.hk.up);
  $("hk-down").textContent=capturing==="down"?"Press keys\u2026":prettyAccel(S.hk.down);
  $("hk-up").className="hkfield"+(capturing==="up"?" rec":"");
  $("hk-down").className="hkfield"+(capturing==="down"?" rec":"");
  if(!DESK)return;
  var cfg=capturing?{up:"",down:""}:{up:S.hk.up||"",down:S.hk.down||""};
  window.desktop.setHotkeys(cfg).then(function(r){
    if(capturing||!r)return;
    ["up","down"].forEach(function(d){
      if(r[d]==="busy")hkStatus(d,"Another program is using this shortcut. Pick a different one.",true);
      else if(r[d]==="invalid")hkStatus(d,"Windows can't use this shortcut. Pick a different one.",true);
      else if(r[d]==="ok")hkStatus(d,"Active everywhere.",false);
      else hkStatus(d,"",false);
    });
  }).catch(function(){});
}
$("hknote").textContent=DESK?"These work even when another window has focus. Each shortcut needs Ctrl, Alt, Shift or Win, unless it is an F key or a numpad key.":"In a browser these only work while this page is focused. The desktop program makes them work everywhere.";
function openSettings(){$("settings").hidden=false;$("sclose").focus();}
function closeSettings(){capturing=null;applyHotkeys();$("settings").hidden=true;$("gear").focus();}
function renderLog(){
  var o=$("lglist");o.innerHTML="";
  $("lgn").textContent=S.log.length?S.log.length+" entries since last reset":"Nothing logged yet.";
  [["Drop","Drops"],["Box","Mystery box"],["Monkey","Monkey rounds"]].forEach(function(g){
    var items=S.log.filter(function(e){return e.k===g[0];}).reverse();
    var h=document.createElement("p");h.className="cap lgh";h.textContent=g[1]+" \u00b7 "+items.length;o.appendChild(h);
    if(!items.length){var n=document.createElement("p");n.className="hint";n.textContent="None yet.";o.appendChild(n);return;}
    items.forEach(function(e){
      var d=new Date(e.t),row=document.createElement("div");row.className="lgrow"+(e.off?" off":"");
      var tm=document.createElement("time");tm.textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      var l=document.createElement("span");l.textContent=e.l+(e.off?" (removed)":"");
      row.appendChild(tm);row.appendChild(l);o.appendChild(row);
    });
  });
}
function openLog(){renderLog();$("logm").hidden=false;$("lclose").focus();}
function closeLog(){$("logm").hidden=true;$("logbtn").focus();}
$("logbtn").onclick=openLog;$("lclose").onclick=closeLog;
$("logm").onclick=function(e){if(e.target===this)closeLog();};
$("gear").onclick=openSettings;
$("sclose").onclick=closeSettings;
$("settings").onclick=function(e){if(e.target===this)closeSettings();};
["up","down"].forEach(function(d){
  $("hk-"+d).onclick=function(){capturing=d;hkStatus("up","",false);hkStatus("down","",false);if(!DESK)hkStatus(d,"Press the keys you want to use. Esc cancels.",false);applyHotkeys();};
  $("hkc-"+d).onclick=function(){S.hk[d]="";capturing=null;hkStatus(d,"",false);save();applyHotkeys();};
});
document.addEventListener("keydown",function(e){
  if(capturing){
    e.preventDefault();e.stopPropagation();
    if(e.key==="Escape"){capturing=null;hkStatus("up","",false);hkStatus("down","",false);applyHotkeys();return;}
    var a=accelFromEvent(e);
    if(a===null)return;
    var d=capturing;
    if(a==="!"){hkStatus(d,"Add Ctrl, Alt, Shift or Win to the key.",true);return;}
    var other=d==="up"?"down":"up";
    capturing=null;
    if(S.hk[other]===a){S.hk[other]="";hkStatus(other,"",false);}
    S.hk[d]=a;save();applyHotkeys();
    if(!DESK)hkStatus(d,"Saved. Works while this page is focused.",false);
    return;
  }
  if(!$("logm").hidden){if(e.key==="Escape")closeLog();return;}
  if(!$("settings").hidden){if(e.key==="Escape")closeSettings();return;}
  if(DESK)return;
  var a2=accelFromEvent(e);
  if(!a2||a2==="!")return;
  if(S.hk.up&&a2===S.hk.up){e.preventDefault();stepRound(1);}
  else if(S.hk.down&&a2===S.hk.down){e.preventDefault();stepRound(-1);}
},true);
if(DESK&&typeof window.desktop.onRoundStep==="function")window.desktop.onRoundStep(function(d){stepRound(d);});
applyHotkeys();
var SECS=[["drops","Drops"],["monkey","Monkey round"],["hordes","Hordes"],["box","Mystery box"]];
function applyHide(){
  var m=document.querySelector("main");
  SECS.forEach(function(x){m.classList.toggle("hide-"+x[0],!!S.hide[x[0]]);});
}
(function(){
  var o=$("secs");
  SECS.forEach(function(x){
    var lb=document.createElement("label");lb.className="sw";
    var sp=document.createElement("span");sp.textContent=x[1];
    var cb=document.createElement("input");cb.type="checkbox";cb.setAttribute("role","switch");cb.checked=!S.hide[x[0]];
    var kn=document.createElement("i");
    cb.onchange=function(){if(cb.checked)delete S.hide[x[0]];else S.hide[x[0]]=true;save();applyHide();};
    lb.appendChild(cb);lb.appendChild(kn);lb.appendChild(sp);o.appendChild(lb);
  });
  applyHide();
})();
function applyAcc(){
  var hex=S.col,n=parseInt(hex.slice(1),16),R=n>>16&255,G=n>>8&255,B=n&255,st=document.documentElement.style;
  function mix(k,base){base=base||[7,8,10];return "rgb("+Math.round(R*k+base[0]*(1-k))+","+Math.round(G*k+base[1]*(1-k))+","+Math.round(B*k+base[2]*(1-k))+")";}
  var mx=Math.max(R,G,B)/255,mn=Math.min(R,G,B)/255,d=mx-mn,hue=0;
  if(d>0){if(mx*255===R)hue=((G-B)/255/d+6)%6;else if(mx*255===G)hue=(B-R)/255/d+2;else hue=(R-G)/255/d+4;hue*=60;}
  var lum=(0.299*R+0.587*G+0.114*B)/255,goldish=d>0.15&&Math.abs(hue-45)<30;
  st.setProperty("--red",hex);st.setProperty("--rgb",R+","+G+","+B);
  st.setProperty("--red-d",mix(0.24));st.setProperty("--red-line",mix(0.64));st.setProperty("--glow",mix(0.16));
  st.setProperty("--line",mix(0.2,[44,44,46]));
  st.setProperty("--time",goldish?"#ffffff":"#ffd24a");st.setProperty("--on",lum>0.6?"#07080a":"#ffffff");
  var de=document.documentElement;
  if(S.xmas){de.setAttribute("data-xmas","1");st.setProperty("--red-d","#0f3a1c");st.setProperty("--red-line","#2fbf62");st.setProperty("--glow","#0d2a16");st.setProperty("--line","#27402d");st.setProperty("--rgb","47,191,98");st.setProperty("--time","#ffe27a");}
  else de.removeAttribute("data-xmas");
  $("xmasck").checked=!!S.xmas;
  $("colpick").value=hex;$("colhex").textContent=hex;
}
(function(){
  $("colpick").oninput=function(){S.col=this.value.toLowerCase();save();applyAcc();};
  $("xmasck").onchange=function(){S.xmas=this.checked;save();applyAcc();};
  $("colrst").onclick=function(){S.col=DEFCOL;save();applyAcc();};
  applyAcc();
})();
render();
})();
</script>
